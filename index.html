const SC=6;
function drawSprite(cv,grid,pal){
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  grid.forEach((row,y)=>[...row].forEach((c,x)=>{
    if(c!=='.'&&pal[c]){ctx.fillStyle=pal[c];ctx.fillRect(x*SC,y*SC,SC,SC);}
  }));
}
function mkCV(sprite,px){
  const cv=document.createElement('canvas');
  const sz=px*SC;
  cv.width=sz;cv.height=sz;
  cv.style.cssText=`width:${sz}px;height:${sz}px;border:3px solid var(--border);box-shadow:4px 4px 0 #000;display:block;`;
  drawSprite(cv,sprite.grid,sprite.palette);
  return cv;

  if(money>=50000||(integrity<40&&money>0)) return 'scandal';
  if(integrity<50) return 'critical';
  if(integrity>=90) return 'hero';
  return 'reelect';
}

function drawBerlinMap(canvas){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const cols=MMAP[0].length, rows=MMAP.length;
  const pw=W/cols, ph=H/rows;

  // Background
  ctx.fillStyle='#0d0d1f';
  ctx.fillRect(0,0,W,H);

  // Draw map grid
  MMAP.forEach((row,y)=>{
    [...row].forEach((c,x)=>{
      if(c!=='.'&&MPAL[c]){
        ctx.fillStyle=MPAL[c];
        ctx.fillRect(Math.round(x*pw),Math.round(y*ph),Math.ceil(pw)+1,Math.ceil(ph)+1);
      }
    });
  });

  // Grid overlay for pixel feel
  ctx.strokeStyle='rgba(0,0,0,0.15)';
  ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=pw*4){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=ph*4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Spree label
  ctx.fillStyle='rgba(100,160,255,0.5)';
  ctx.font='bold 10px monospace';
  ctx.fillText('~ SPREE ~', W*0.1, H*0.35);

  // Tiergarten label
  ctx.fillStyle='rgba(60,120,60,0.7)';
  ctx.font='bold 9px monospace';
  ctx.fillText('TIERGARTEN', W*0.04, H*0.27);

  // Reichstag marker
  ctx.fillStyle='#f0c040';
  ctx.font='bold 10px monospace';
  ctx.fillText('🏛', W*0.38, H*0.31);
}

function drawMapPins(canvas, hoverId){
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;

  MAP_PINS.forEach(pin=>{
    const done=G.done.includes(pin.id);
    const hov=pin.id===hoverId;
    const px=pin.x/100*W;
    const py=pin.y/100*H;

    // Pulse ring for undone
    if(!done){
      ctx.beginPath();
      ctx.arc(px,py,hov?18:14,0,Math.PI*2);
      ctx.fillStyle=hov?pin.color+'55':pin.color+'33';
      ctx.fill();
    }

    // Pin circle
    ctx.beginPath();
    ctx.arc(px,py,hov?12:9,0,Math.PI*2);
    ctx.fillStyle=done?'#303050':pin.color;
    ctx.fill();
    ctx.strokeStyle=done?'#505070':'#fff';
    ctx.lineWidth=2;
    ctx.stroke();

    // Icon or checkmark
    ctx.font=`${hov?14:11}px serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(done?'✓':pin.icon, px, py);

    // Label bubble
    const lines=pin.label.split('\n');
    const lw=Math.max(...lines.map(l=>l.length))*5.5+10;
    const lh=lines.length*13+8;
    const lx=px-lw/2;
    const ly=py+15;

    // Keep label inside canvas
    const clampedLx=Math.max(4,Math.min(W-lw-4,lx));

    ctx.fillStyle=done?'rgba(30,30,60,0.85)':'rgba(10,10,30,0.92)';
    ctx.strokeStyle=done?'#505070':pin.color;
    ctx.lineWidth=1.5;
    roundRect(ctx,clampedLx,ly,lw,lh,4);
    ctx.fill();ctx.stroke();

    ctx.fillStyle=done?'#606080':pin.color;
    ctx.font=`bold 8px "Press Start 2P", monospace`;
    ctx.textAlign='center';
    lines.forEach((l,i)=>{
      ctx.fillText(l, clampedLx+lw/2, ly+10+i*13);
    });
    ctx.textAlign='left';
    ctx.textBaseline='alphabetic';
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

    <div class="panel-title">🗺️ BERLIN – KAPITEL 1: DIE LOBBYISTEN</div>
    <div style="font-size:8px;color:var(--gray);margin-bottom:10px;text-align:center;">

      <div id="map-tooltip" style="display:none;position:absolute;background:var(--panel);border:2px solid var(--gold);
        padding:8px 12px;font-size:8px;color:var(--gold);box-shadow:3px 3px 0 #000;pointer-events:none;z-index:10;line-height:1.8;"></div>

    Deine Entscheidungen bestimmen dein Ende in Kapitel 2!
  </div>`;

  // Setup canvas
  const canvas=document.getElementById('berlin-map');
  // Set internal resolution
  const W=820,H=460;
  canvas.width=W;canvas.height=H;

  // Draw base map
  drawBerlinMap(canvas);
  drawMapPins(canvas,null);

  // Animate undone pins with pulse
  let frame=0;
  let animId=null;
  function animate(){
    drawBerlinMap(canvas);
    // pulsing: vary ring size with sin
    const t=Date.now()/600;
    const ctx=canvas.getContext('2d');
    MAP_PINS.forEach(pin=>{
      const done=G.done.includes(pin.id);
      const px=pin.x/100*W;
      const py=pin.y/100*H;
      if(!done){
        const r=11+Math.sin(t+pin.x)*3;
        ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);
        ctx.fillStyle=pin.color+'44';ctx.fill();
      }
    });
    drawMapPins(canvas,null);
    animId=requestAnimationFrame(animate);
  }
  animate();

  // Store animId to cancel on screen change
  canvas._animId=animId;
  canvas.addEventListener('animId',()=>cancelAnimationFrame(animId));

  // Mouse interaction
  canvas.addEventListener('mousemove',e=>{
    const rect=canvas.getBoundingClientRect();
    const scaleX=W/rect.width;
    const scaleY=H/rect.height;
    const mx=(e.clientX-rect.left)*scaleX;
    const my=(e.clientY-rect.top)*scaleY;
    let hit=null;
    MAP_PINS.forEach(pin=>{
      const px=pin.x/100*W;
      const py=pin.y/100*H;
      const dist=Math.sqrt((mx-px)**2+(my-py)**2);
      if(dist<22)hit=pin;
    });
    canvas.style.cursor=hit&&!G.done.includes(hit.id)?'pointer':'default';
    const tip=document.getElementById('map-tooltip');
    if(hit){
      const loc=LOCS.find(l=>l.id===hit.id);
      const done=G.done.includes(hit.id);
      tip.style.display='block';
      tip.style.left=(e.clientX-rect.left+12)+'px';
      tip.style.top=(e.clientY-rect.top-10)+'px';
      tip.innerHTML=`<span style="color:${hit.color}">${hit.icon} ${hit.label.replace('\n',' ')}</span><br>
        <span style="color:var(--gray)">${loc?loc.lobby:''}</span><br>
        <span style="color:${done?'var(--green)':'var(--gold)'}">${done?'✓ ERLEDIGT':'▶ BETRETEN'}</span>`;
    } else {
      tip.style.display='none';
    }
  });

  canvas.addEventListener('mouseleave',()=>{
    document.getElementById('map-tooltip').style.display='none';
  });

  canvas.addEventListener('click',e=>{
    const rect=canvas.getBoundingClientRect();
    const scaleX=W/rect.width;
    const scaleY=H/rect.height;
    const mx=(e.clientX-rect.left)*scaleX;
    const my=(e.clientY-rect.top)*scaleY;
    MAP_PINS.forEach(pin=>{
      const px=pin.x/100*W;
      const py=pin.y/100*H;
      const dist=Math.sqrt((mx-px)**2+(my-py)**2);
      if(dist<22&&!G.done.includes(pin.id)){
        const loc=LOCS.find(l=>l.id===pin.id);
        if(loc){
          cancelAnimationFrame(canvas._animId);
          startScene(loc);
        }
      }
    });
  });

  checkMapDone();
  updateStats();
}

function checkMapDone(){
  const allDone=G.done.length===LOCS.length;
  const tip=document.getElementById('maptip');
  if(tip&&allDone){
    tip.innerHTML=`<span class="info-title">✓ KAPITEL 1 ABGESCHLOSSEN!</span>
    Alle 5 Locations besucht. Deine Entscheidungen haben dich geformt.<br>
    <button class="pixel-btn gold" id="epi-start-btn" style="margin-top:12px;">▶ KAPITEL 2: DIE KONSEQUENZEN</button>`;
    document.getElementById('epi-start-btn').addEventListener('click',()=>startEpilogue());
  }
}

function updateStats(){
  const i=Math.max(0,Math.min(100,G.integrity));
  const ic=i>60?'var(--green)':i>30?'var(--orange)':'var(--red)';
  const si=document.getElementById('st-i');const bi=document.getElementById('br-i');
  const sf=document.getElementById('st-f');const bf=document.getElementById('br-f');
  const sm=document.getElementById('st-m');const bm=document.getElementById('br-m');
  const ss=document.getElementById('st-s');const bs=document.getElementById('br-s');
  if(si){si.textContent=i;si.style.color=ic;bi.style.width=i+'%';bi.style.background=ic;}
  if(sf){sf.textContent=G.influence;bf.style.width=Math.min(100,G.influence)+'%';}
  if(sm){sm.textContent=G.money>0?G.money+'€':'0';bm.style.width=Math.min(100,G.money/1000)+'%';}
  if(ss){ss.textContent=G.done.length+'/5';bs.style.width=(G.done.length/5*100)+'%';}
}

    <div class="npc-row" id="npc-slot">

        <div class="npc-role-txt">${npc.role}</div>

      <span class="info-title">📊 ${loc.lobby.toUpperCase()} – REALE DATEN</span>${sc.realFact}
    </div>
    <div class="pixel-divider"></div>
    <div style="font-size:9px;color:var(--gold);margin-bottom:12px;">▶ WAS TUT ${G.player?G.player.name.split(' ')[0]:'DU'}?</div>
    <div class="choices">${choices}</div>
  </div>
  <div style="text-align:center;margin-top:12px;">
    <button class="pixel-btn" id="sc-back-btn">◀ ZURÜCK ZUR KARTE</button>
  </div>`;
  document.getElementById('npc-slot').prepend(npcCv);

function makeChoice(idx){
  const sc=G.scene.scenario;const ch=sc.choices[idx];
  G.integrity+=ch.effect.i;G.influence+=ch.effect.f;G.money+=ch.effect.m;
  G.integrity=Math.max(0,G.integrity);
  if(!G.done.includes(G.scene.id))G.done.push(G.scene.id);
  G.choices.push({scene:G.scene.id,idx,type:ch.type});
  showResult(ch);
}

function showResult(ch){
  const cls=ch.type==='good'?'consequence-good':ch.type==='bad'?'consequence-bad':'consequence-neutral';
  const fx=[];
  if(ch.effect.i>0)fx.push(`<span style="color:var(--green)">+${ch.effect.i} INTEGRITÄT</span>`);
  if(ch.effect.i<0)fx.push(`<span style="color:var(--red)">${ch.effect.i} INTEGRITÄT</span>`);
  if(ch.effect.f>0)fx.push(`<span style="color:var(--blue)">+${ch.effect.f} EINFLUSS</span>`);
  if(ch.effect.m>0)fx.push(`<span style="color:var(--gold)">+${ch.effect.m}€ LOBBY-€</span>`);
  const left=LOCS.filter(l=>!G.done.includes(l.id)).length;
  const pCv=G.player?mkCV(G.player,12):null;
  document.getElementById('result-content').innerHTML=`
  <div class="panel">
    <div class="panel-title">⚡ KONSEQUENZ</div>
    <div id="rcv" style="text-align:center;margin-bottom:12px;"></div>
    <div class="${cls} consequence-box">${ch.consequence.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;">${fx.join('')}</div>
    <div class="pixel-divider"></div>
    <div class="info-card">
      <span class="info-title">🎓 FACHWISSEN</span>${ch.learn}
    </div>
    <div style="margin-top:16px;text-align:center;">
      <div style="font-size:8px;color:var(--gray);margin-bottom:12px;">
        SZENARIEN: ${G.done.length}/5 · INTEGRITÄT: ${Math.max(0,Math.min(100,G.integrity))} · ${left>0?left+' VERBLEIBEND':'KAPITEL 1 FERTIG!'}
      </div>
      ${left>0
        ?`<button class="pixel-btn gold" id="res-map-btn">◀ ZUR KARTE</button>`
        :`<button class="pixel-btn green" id="res-epi-btn">▶ KAPITEL 2: DIE KONSEQUENZEN</button>`}
    </div>
  </div>`;
  if(pCv){pCv.style.margin='0 auto';document.getElementById('rcv').appendChild(pCv);}
  if(left>0){
    const b=document.getElementById('res-map-btn');
    if(b)b.addEventListener('click',()=>{buildMap();go('map');});
  } else {
    const b=document.getElementById('res-epi-btn');
    if(b)b.addEventListener('click',()=>startEpilogue());
  }
  go('result');
}

function startEpilogue(){
  const path=getEpiloguePath(G.integrity,G.money,G.influence);
  G.epiloguePath=path;
  const ep=EPILOGUES[path];
  epiSceneIdx=0;epiChoiceMade=false;
  buildEpiScene(ep,0);go('epilogue');
}

function buildEpiScene(ep,idx){
  const npc=NPCS[ep.npcKey];
  const npcCv=mkCV(npc,16);
  const pCv=G.player?mkCV(G.player,12):null;
  const sc=ep.scenes[idx];
  const isLast=idx>=ep.scenes.length-1;
  document.getElementById('epilogue-content').innerHTML=`
  <div class="panel">
    <div class="panel-title" style="color:${ep.color}">📖 ${ep.title}</div>
    <div style="text-align:center;font-size:36px;margin:12px 0;">${ep.icon}</div>
    <div style="text-align:center;">
      <div class="epilogue-headline" style="border-color:${ep.headlineColor};color:${ep.headlineColor};">${ep.headline}</div>
    </div>
    <div class="npc-row" id="epi-npc" style="margin-top:16px;">
      <div class="npc-bio-box">
        <div class="npc-name-txt" style="color:${ep.color}">${npc.name}</div>
        <div class="npc-role-txt">${npc.role}</div>
        ${pCv?`<div id="epi-pcv" style="margin-top:8px;"></div>`:''}
      </div>
    </div>
    <div class="dialogue-box" style="border-color:${ep.color};">
      <div class="dialogue-speaker" style="color:${ep.color};">${sc.isNarrator?'ERZÄHLER':sc.speaker}</div>
      <div class="dialogue-text">${(sc.text||sc.txt||'').replace(/\n/g,'<br>')}</div>
    </div>
    <div style="text-align:center;margin-top:12px;">
      ${isLast&&!epiChoiceMade
        ?buildEpiChoices(ep)
        :`<button class="pixel-btn" onclick="nextEpiScene()">WEITER ▶</button>`}
    </div>
  </div>`;
  document.getElementById('epi-npc').prepend(npcCv);
  if(pCv&&document.getElementById('epi-pcv'))document.getElementById('epi-pcv').appendChild(pCv);
}

function buildEpiChoices(ep){
  return `<div class="choices" style="text-align:left;">
    ${ep.choices.map((c,i)=>`
    <button class="choice-btn" onclick="makeEpiChoice(${i})">
      <span class="choice-prefix">${['A','B'][i]}▶</span>
      <span>${c.text}</span>
    </button>`).join('')}
  </div>`;
}

function nextEpiScene(){
  epiSceneIdx++;
  const ep=EPILOGUES[G.epiloguePath];
  if(epiSceneIdx<ep.scenes.length){buildEpiScene(ep,epiSceneIdx);}
  else{buildEpiScene(ep,ep.scenes.length-1);}
}

function makeEpiChoice(idx){
  epiChoiceMade=true;
  const ep=EPILOGUES[G.epiloguePath];
  const ch=ep.choices[idx];
  G.epilogueChoice={idx,type:ch.type};
  G.integrity+=ch.effect.i;G.influence+=ch.effect.f;
  const cls=ch.type==='good'?'consequence-good':ch.type==='bad'?'consequence-bad':'consequence-neutral';
  const div=document.createElement('div');
  div.className=cls+' consequence-box';
  div.innerHTML=ch.consequence.replace(/\n/g,'<br>');
  const learnDiv=document.createElement('div');
  learnDiv.className='info-card';learnDiv.style.marginTop='12px';
  learnDiv.innerHTML=`<span class="info-title">🎓 FACHWISSEN</span>${ch.learn}`;
  const btn=document.createElement('div');
  btn.style.textAlign='center';btn.style.marginTop='16px';
  btn.innerHTML=`<button class="pixel-btn gold" onclick="showFinal()">▶ ABSCHLUSSBILDSCHIRM</button>`;
  document.querySelector('#epilogue-content .panel').appendChild(div);
  document.querySelector('#epilogue-content .panel').appendChild(learnDiv);
  document.querySelector('#epilogue-content .panel').appendChild(btn);
  // Remove old buttons
  const oldChoices=document.querySelector('#epilogue-content .choices');
  if(oldChoices)oldChoices.remove();
}

  {q:'Seit wann gibt es in Deutschland ein Pflicht-Lobbyregister?',
   opts:['A: 2010','B: 2015','C: 2022','D: Es gibt noch keins'],
   ans:2,learn:'Das verpflichtende Lobbyregister beim Bundestag wurde 2022 eingeführt – Deutschland war eines der letzten EU-Länder. Kritiker halten es für noch unvollständig.'},
  {q:'Was bedeutet „Regulatory Capture"?',
   opts:['A: Staatliche Übernahme von Unternehmen','B: Wenn Regulierte ihre Regulierer durch Einfluss kontrollieren','C: Ein Begriff für staatliche Überwachung','D: Die Kontrolle der Polizei durch den Staat'],
   ans:1,learn:'Regulatory Capture: Wenn die zu regulierenden Akteure (z.B. Konzerne) so viel Einfluss gewinnen, dass Gesetze zu ihren Gunsten und gegen das Allgemeinwohl geschrieben werden.'},
  {q:'Was ist Lobbyismus grundsätzlich?',
   opts:['A: In Deutschland verboten','B: Legal und in einer Demokratie auch nötig','C: Nur in autoritären Systemen relevant','D: Ausschließlich eine Form der Korruption'],
   ans:1,learn:'Lobbyismus ist legal und demokratisch notwendig – Abgeordnete brauchen Expertise. Die Grenze liegt bei finanziellen Zuwendungen, Abhängigkeit und mangelnder Transparenz.'}
];
let quizState={};

function buildQuiz(){
  const wrap=document.getElementById('qwrap');if(!wrap)return;
  wrap.innerHTML='';
  QUIZ.forEach((q,qi)=>{
    const div=document.createElement('div');
    div.style.marginBottom='20px';
    div.innerHTML=`<div class="quiz-q">${qi+1}. ${q.q}</div>
      ${q.opts.map((o,oi)=>`<button class="quiz-opt" id="qo-${qi}-${oi}" onclick="answerQuiz(${qi},${oi})">${o}</button>`).join('')}
      <div id="qf-${qi}" style="display:none;" class="quiz-feedback"></div>`;
    wrap.appendChild(div);
  });
}

function answerQuiz(qi,oi){
  if(quizState[qi]!==undefined)return;
  quizState[qi]=oi;
  const q=QUIZ[qi];
  for(let i=0;i<q.opts.length;i++){
    const btn=document.getElementById(`qo-${qi}-${i}`);
    if(i===q.ans)btn.classList.add('correct');
    else if(i===oi&&oi!==q.ans)btn.classList.add('wrong');
  }
  const fb=document.getElementById(`qf-${qi}`);
  fb.style.display='block';
  fb.style.borderColor=oi===q.ans?'var(--green)':'var(--red)';
  fb.style.background=oi===q.ans?'rgba(64,192,64,.1)':'rgba(192,64,64,.1)';
  fb.style.color=oi===q.ans?'var(--green)':'var(--white)';
  fb.innerHTML=(oi===q.ans?'✓ RICHTIG! ':' ✗ FALSCH. ')+q.learn;
}

const GLOSSARY=[
  {term:'Agenda-Setting',def:'Die Macht zu bestimmen, worüber politisch debattiert wird – und worüber nicht. Wer die Themen setzt, hat Einfluss, ohne direkten Druck auszuüben.',ex:'Wenn ein Konzern bewirkt, dass sein Thema ganz oben auf der politischen Tagesordnung steht, betreibt er Agenda-Setting.'},
  {term:'Abgeordnete/r (MdB)',def:'Mitglied des Deutschen Bundestages. Direkt vom Volk gewählt, vertritt einen Wahlkreis und eine Partei. Hat das Recht, Gesetzentwürfe einzubringen und abzustimmen.',ex:'Jana Weber ist in diesem Spiel eine fiktive MdB für den Wahlkreis Köln-Nord.'},
  {term:'Bestechung von Mandatsträgern',def:'Strafbar nach §108e StGB. Wer einem Abgeordneten Geld oder Vorteile für eine bestimmte Abstimmung anbietet oder annimmt, macht sich strafbar. Strafe: bis zu 5 Jahre Haft.',ex:'General Bremer bietet eine Parteispende für eine Zustimmung zum Waffenexport an – das ist genau dieser Straftatbestand.'},
  {term:'Bundesrat',def:'Eines der fünf Verfassungsorgane Deutschlands. Vertritt die 16 Bundesländer auf Bundesebene. Bei bestimmten Gesetzen (Zustimmungsgesetze) hat er ein echtes Vetorecht.',ex:'Beim Heizkostenzuschussgesetz 2022 billigte der Bundesrat das Gesetz ohne Anrufung des Vermittlungsausschusses.'},
  {term:'Bundestag',def:'Das deutsche Parlament. Besteht aus direkt gewählten Abgeordneten. Wichtigstes Legislativorgan – verabschiedet Gesetze, wählt den Bundeskanzler, kontrolliert die Regierung.',ex:'Im Spiel ist der Bundestag der Hauptschauplatz, an dem Lobbyisten Einfluss nehmen wollen.'},
  {term:'Corporate Lobbying',def:'Interessenvertretung durch große Unternehmen oder Unternehmensverbände. Ziel: Gesetze und Regulierungen im eigenen wirtschaftlichen Interesse beeinflussen.',ex:'PharmaDeutsch, der Gasverband und die Deutsche Großbank sind Beispiele für Corporate Lobbying im Spiel.'},
  {term:'Direktlobbyismus',def:'Die direkteste Form: Persönliche Gespräche zwischen Lobbyisten und Abgeordneten oder Ministeriumsmitarbeitern, um politische Positionen zu beeinflussen.',ex:'Dr. Hartmanns Meeting im Wirtschaftsministerium ist klassischer Direktlobbyismus.'},
  {term:'Drehtür-Prinzip (Revolving Door)',def:'Der Wechsel von Politikern in die Wirtschaft (für die sie vorher Entscheidungen getroffen haben) – oder umgekehrt. Schafft Loyalitäten und Interessenkonflikte.',ex:'Dr. Fischer war Pharmakologin an der Uni, wechselte dann zu PharmaDeutsch. Für Minister gilt eine Karenzzeit von 18 Monaten.'},
  {term:'Effizienz (politisch)',def:'Bezeichnet, ob eine politische Entscheidung ihr Ziel schnell, zielgenau und mit angemessenem Aufwand erreicht. In der Demokratie oft im Spannungsfeld mit Legitimität.',ex:'War das Heizkostenzuschussgesetz effizient? Es dauerte 4 Monate – für akut frierenden Familien möglicherweise zu lang.'},
  {term:'Fraktion',def:'Zusammenschluss von Abgeordneten derselben oder ähnlicher Parteien im Parlament. Fraktionen können Gesetzentwürfe einbringen und haben mehr Rechte als einzelne Abgeordnete.',ex:'Die Koalitionsfraktionen SPD, Grüne und FDP brachten 2022 gemeinsam den Heizkostenzuschuss-Entwurf ein.'},
  {term:'Grassroots-Lobbying',def:'Mobilisierung der breiten Bevölkerung für politische Ziele einer Interessengruppe. Erscheint als Bürgerbewegung, ist aber oft professionell organisiert.',ex:'Wenn ein Konzern Bürger dazu bringt, Petitionen für seine Interessen zu unterschreiben, ist das Grassroots-Lobbying.'},
  {term:'Informationslobbyismus',def:'Die subtilste Form: Bereitstellung von (selektiven) Studien, Daten und Expertenwissen, um das Framing einer Debatte zu kontrollieren.',ex:'MetaSpheres Angebot, Jana exklusiven Datenzugang zu geben, ist Informationslobbyismus.'},
  {term:'Interessengruppe',def:'Eine Organisation, die die Interessen einer bestimmten Gruppe gegenüber dem Staat vertritt. Kann ein Wirtschaftsverband, eine NGO, eine Gewerkschaft oder ein Unternehmen sein.',ex:'Der Gasverband Deutschland, ver.di und Amnesty International sind alle Interessengruppen – mit sehr unterschiedlichen Mitteln.'},
  {term:'Karenzzeit',def:'Wartefrist, die bestimmte Amtsträger einhalten müssen, bevor sie in die Privatwirtschaft wechseln dürfen. Soll das Drehtür-Prinzip begrenzen.',ex:'In Deutschland gilt für Bundesminister eine Karenzzeit von 18 Monaten. Für einfache Abgeordnete gibt es keine Pflicht-Karenzzeit.'},
  {term:'Legitimität (politisch)',def:'Bezeichnet, ob eine politische Entscheidung auf dem richtigen Weg zustande kam: regelkonform, transparent, unter Beteiligung aller relevanten Stimmen.',ex:'Der Gesetzgebungsweg beim Heizkostenzuschuss war legitim: Ausschussanhörung, Bundesratsbeteiligung, öffentliche Abstimmung.'},
  {term:'Lobbyismus',def:'Die gezielte Einflussnahme organisierter Interessengruppen auf politische Entscheidungsträger. In Demokratien legal und grundsätzlich legitim – solange transparent.',ex:'Alle fünf Szenarien dieses Spiels zeigen verschiedene Formen des Lobbyismus.'},
  {term:'Lobbyregister',def:'Seit 2022 müssen sich alle Interessengruppen, die Einfluss auf den Bundestag oder die Bundesregierung nehmen wollen, in einem öffentlichen Register eintragen.',ex:'Der Gasverband ist im Lobbyregister eingetragen und gibt an, 820.000 € pro Jahr für Lobbying auszugeben.'},
  {term:'Mandat',def:'Der politische Auftrag, den ein Abgeordneter durch die Wahl erhält. Ein freies Mandat bedeutet: Abgeordnete sind nur ihrem Gewissen verpflichtet – nicht ihrer Partei oder Lobbyisten.',ex:'Jana Weber hat ein freies Mandat. Trotzdem versuchen Lobbyisten, ihre Entscheidungen zu beeinflussen.'},
  {term:'Parteispende',def:'Geldleistung an eine politische Partei. Spenden über 50.000 € müssen sofort veröffentlicht werden. Darunter gibt es eine Grauzone, die systematisch genutzt wird.',ex:'General Bremers Angebot einer Wahlkampfspende ist eine klassische (und hier strafbare) Form der Einflussnahme über Parteispenden.'},
  {term:'Regulatory Capture',def:'Wenn Regulierte (z.B. Konzerne) so viel Einfluss auf ihre Regulierer (Ministerien, Abgeordnete) gewinnen, dass Gesetze zu ihren Gunsten geschrieben werden.',ex:'Im Finanzausschuss waren 17 von 20 Studien zur Finanztransaktionssteuer von der Finanzbranche finanziert – ein klassisches Capture-Muster.'},
  {term:'Transparenz (politisch)',def:'Das Prinzip, dass politische Entscheidungen und die daran beteiligten Akteure und Interessen öffentlich einsehbar sein sollen.',ex:'AbgeordnetenWatch und das Lobbyregister sind Instrumente zur Herstellung von Transparenz in der deutschen Politik.'},
  {term:'Vermittlungsausschuss',def:'Gemeinsames Gremium von Bundestag und Bundesrat. Tritt zusammen, wenn der Bundesrat einem Gesetz widerspricht und versucht, einen Kompromiss zu finden.',ex:'Beim Heizkostenzuschussgesetz wurde der Vermittlungsausschuss nicht angerufen – der Bundesrat billigte direkt.'},
  {term:'Wahlkampffinanzierung',def:'Wie Parteien ihre Wahlkämpfe finanzieren: durch staatliche Parteienfinanzierung, Mitgliedsbeiträge und Spenden. Transparenz ist gesetzlich vorgeschrieben – mit Lücken.',ex:'Spenden unter 50.000 € müssen nicht sofort gemeldet werden. Diese Grauzone nutzen Lobbyisten systematisch.'},
];

function openGlossary(){
  buildGlossaryEntries('');
  document.getElementById('g-search').value='';
  document.getElementById('glossary-overlay').classList.add('open');
  document.getElementById('g-search').focus();
}

function closeGlossary(){
  document.getElementById('glossary-overlay').classList.remove('open');
}

function filterGlossary(q){
  buildGlossaryEntries(q.toLowerCase().trim());
}

function buildGlossaryEntries(filter){
  const container=document.getElementById('g-entries');
  const filtered=filter
    ?GLOSSARY.filter(g=>g.term.toLowerCase().includes(filter)||g.def.toLowerCase().includes(filter))
    :GLOSSARY;

  if(filtered.length===0){
    container.innerHTML=`<div style="font-size:9px;color:var(--gray);text-align:center;padding:20px;">
      Kein Begriff gefunden für „${filter}"</div>`;
    return;
  }

  // Group by first letter if no filter
  if(!filter){
    const byLetter={};
    filtered.forEach(g=>{
      const l=g.term[0].toUpperCase();
      if(!byLetter[l])byLetter[l]=[];
      byLetter[l].push(g);
    });
    container.innerHTML=Object.keys(byLetter).sort().map(l=>`
      <div class="g-letter">— ${l} —</div>
      ${byLetter[l].map(g=>termHTML(g,'')).join('')}
    `).join('');
  } else {
    container.innerHTML=`
      <div style="font-size:8px;color:var(--gray);margin-bottom:12px;">${filtered.length} Ergebnis${filtered.length!==1?'se':''} für „${filter}"</div>
      ${filtered.map(g=>termHTML(g,filter)).join('')}`;
  }
}

function termHTML(g,hl){
  const name=hl?g.term.replace(new RegExp(hl,'gi'),m=>`<span style="color:var(--gold)">${m}</span>`):g.term;
  return `<div class="g-term">
    <span class="g-term-name">${name}</span>
    <div class="g-term-def">${g.def}</div>
    ${g.ex?`<div class="g-term-ex">▶ BEISPIEL: ${g.ex}</div>`:''}
  </div>`;
}

// Close on overlay click outside box
document.getElementById('glossary-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('glossary-overlay'))closeGlossary();
});

// Close on Escape
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeGlossary();
});
